# 三类宿主预编译 CLI 包(设计:外网访问和分发)。
# 推送 v* 标签时构建 Windows / macOS / Linux 的发布压缩包。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zminidump-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zminidump-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zminidump-windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      # 每个目标打成一个带平台与架构名的压缩包;否则 Linux 与 macOS
      # 会向同一 Release 上传同名 `zminidump` 资产互相覆盖。
      - name: Package
        shell: bash
        run: |
          name="${{ matrix.artifact }}"
          mkdir -p stage dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/zminidump.exe" stage/
            tar -a -cf "dist/${name}.zip" -C stage zminidump.exe
          else
            cp "target/${{ matrix.target }}/release/zminidump" stage/
            cp README.md stage/
            tar -czf "dist/${name}.tar.gz" -C stage zminidump README.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
