[package]
name = "zminidump"
version = "0.1.0"
edition = "2024"
description = "Cross-platform viewer for Breakpad and Crashpad minidumps"

[dependencies]
minidump = "0.27.0"
minidump-common = "0.27.0"
minidump-unwind = "0.27.0"
minidump-processor = "0.27.0"
breakpad-symbols = "0.27.0"
dump_syms = "2.3.9"
object = "0.41.0"
memmap2 = "0.9"
debugid = "0.8"
clap = { version = "4.6.9", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-trait = "0.1"
ureq = { version = "3", features = ["rustls"] }

[dev-dependencies]
minidump-synth = "0.27.0"
minidump-writer = "0.14.0"
crash-context = "0.8.0"
minidumper = "0.11.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"
